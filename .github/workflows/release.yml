name: 发布新版本

# 脚本里的 PANEL_VERSION 改成新版本号并推送到 main 后,自动创建对应的 Release,
# 更新说明取自 CHANGELOG.md 里同版本号的那一节,并附上安装脚本。
on:
  push:
    branches: [main]
    paths:
      - xray-traffic-panel.sh
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查脚本语法
        run: bash -n xray-traffic-panel.sh

      - name: 读取版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^PANEL_VERSION=' xray-traffic-panel.sh | cut -d'"' -f2)
          [ -n "$v" ] || { echo "脚本里没有找到 PANEL_VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v 已经发布过,跳过"
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布
        if: steps.ver.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VER" '
            $0 ~ "^## v" v "( |$)" { f = 1; next }
            /^## v/ && f { exit }
            f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "版本 v$VER" > notes.md
          gh release create "v$VER" xray-traffic-panel.sh \
            --target "$GITHUB_SHA" \
            --title "v$VER · 数据流量分析面板" \
            --notes-file notes.md \
            --latest
